<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#17171a;--mid:#66645f;--gold:#b8790a;--gold-bright:#ffb300;--line:rgba(0,0,0,.1);--max:1240px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}img{display:block;max-width:100%}.wrap{max-width:var(--max);margin:auto;padding:0 40px}
header{position:sticky;top:0;z-index:20;background:rgba(250,250,248,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:18px;text-decoration:none}.rh{max-width:142px;max-height:34px}.eg{max-height:45px;max-width:170px}.nav-actions{display:flex;align-items:center;gap:12px}.text-link{text-decoration:none;font-size:13px;color:var(--mid)}.pill{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;background:var(--gold-bright);color:#171100;font-size:13px;font-weight:600;padding:12px 20px}
.back{display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--mid);font-size:13px;margin:30px 0 22px}.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:min(68vh,720px);border-radius:24px;overflow:hidden;background:#eceae4}.gallery figure{margin:0;overflow:hidden;position:relative}.gallery figure:first-child{grid-row:1/3}.gallery img{width:100%;height:100%;object-fit:cover;cursor:pointer;transition:transform .6s ease}.gallery figure:hover img{transform:scale(1.025)}
.details{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:80px;padding:62px 0 110px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600;color:var(--gold)}h1,h2{font-family:'Playfair Display',serif;font-weight:400;letter-spacing:-.025em;margin:0}h1{font-size:clamp(38px,5vw,68px);line-height:1.05;margin:13px 0 22px;max-width:18ch}.price{font-family:'Playfair Display',serif;color:var(--gold);font-style:italic;font-size:27px}.meta{display:flex;gap:0;flex-wrap:wrap;margin:34px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.meta span{padding:19px 28px 19px 0;margin-right:28px;font-size:14px}.copy{max-width:66ch;color:var(--mid);line-height:1.75;font-size:16px}.adviser{position:sticky;top:105px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 55px -38px rgba(0,0,0,.4)}.adviser .name{font-family:'Playfair Display',serif;font-size:25px;margin:8px 0 4px}.adviser p{color:var(--mid);font-size:14px;line-height:1.6}.adviser a{width:100%;margin-top:10px}.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}.loading{min-height:70vh;display:grid;place-items:center;color:var(--mid)}.error{text-align:center;padding:120px 20px}.mobile-bar{display:none}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(8,8,9,.96);display:none;align-items:center;justify-content:center;padding:40px}.lightbox.open{display:flex}.lightbox img{max-height:88vh;max-width:92vw;object-fit:contain}.lightbox button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:25px;cursor:pointer}.close{right:22px;top:22px}.prev{left:22px}.next{right:22px}
@media(max-width:820px){body{padding-bottom:72px}.wrap{padding:0 20px}.nav{height:62px}.rh{max-width:88px}.eg{max-height:34px;max-width:115px}.nav-actions{display:none}.back{margin-top:22px}.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:56svh;border-radius:18px;gap:0}.gallery figure,.gallery figure:first-child{min-width:100%;height:100%;scroll-snap-align:start}.details{grid-template-columns:1fr;gap:35px;padding:42px 0 72px}h1{font-size:clamp(36px,10vw,52px)}.adviser{position:static}.mobile-bar{position:fixed;display:grid;grid-template-columns:1fr 1.25fr;gap:9px;left:0;right:0;bottom:0;z-index:80;padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:rgba(250,250,248,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.mobile-bar a{margin:0;min-height:46px}.meta span{padding:15px 18px 15px 0;margin-right:18px}}
</style>

<body>
<header><div class="wrap nav"><a class="brand" href="/"><img class="rh" src="https://www.raineandhorne.com.au/_next/static/media/RH_Logo_New-Charcoal.3b71c185.png" alt="Raine & Horne"><img class="eg" src="eg-logo.png" alt="Evan Gamkrelidze"></a><div class="nav-actions"><a class="text-link" href="tel:0402466066">0402 466 066</a><a class="pill" href="#enquire">Request an inspection</a></div></div></header>
<main id="app"><div class="loading">Loading property…</div></main>
<div class="lightbox" id="lightbox"><button class="close" aria-label="Close">×</button><button class="prev" aria-label="Previous">‹</button><img id="lightboxImage" alt=""><button class="next" aria-label="Next">›</button></div>
<div class="mobile-bar"><a class="pill outline" href="tel:0402466066">Call Evan</a><a class="pill" href="#enquire">Enquire</a></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://mmznrgyqmcwgcbojfzkg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tem5yZ3lxbWN3Z2Nib2pmemtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTkxODMsImV4cCI6MjA5ODQ3NTE4M30.RzOySFa1BIB93FdBLS6PlrQltWyGPpqXqUYeHosCGDo');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app');let photos=[],active=0;
function meta(p){return[[p.beds,'bed'],[p.baths,'bath'],[p.cars,'car'],[p.sqm,'m²']].filter(([v])=>v!==null&&v!==undefined&&v!==0).map(([v,l])=>`<span><strong>${esc(v)}</strong> ${l}</span>`).join('')}
function openLightbox(i){active=i;document.getElementById('lightboxImage').src=photos[active];document.getElementById('lightbox').classList.add('open')}
async function load(){if(!id){fail();return}const{data:p,error}=await db.from('properties').select('*').eq('id',id).single();if(error||!p){fail();return}photos=[p.image_url,...(Array.isArray(p.images)?p.images:[])].filter(Boolean);if(!photos.length)photos=['eg-logo.png'];document.title=`${p.address} — Evan Gamkrelidze`;app.innerHTML=`<div class="wrap"><a class="back" href="/#${p.category==='sold'?'sold':'listings'}">← Back to ${p.category==='sold'?'results':'listings'}</a><div class="gallery">${photos.slice(0,3).map((src,i)=>`<figure><img src="${esc(src)}" alt="${esc(p.address)} — photo ${i+1}" data-photo="${i}" ${i?'loading="lazy"':''}></figure>`).join('')}</div><div class="details"><div><span class="eyebrow">${esc(p.status||p.category)}</span><h1>${esc(p.address)}</h1><div class="price">${p.price_disclosed&&p.price?esc(p.price):p.category==='sold'?'Price undisclosed':'Contact agent'}</div><div class="meta">${meta(p)}</div><p class="copy">For further information, inspection arrangements or a confidential discussion about this property, contact Evan directly.</p>${p.listing_url?`<p><a class="text-link" href="${esc(p.listing_url)}" target="_blank" rel="noopener">View the full agency listing ↗</a></p>`:''}</div><aside class="adviser" id="enquire"><span class="eyebrow">Your agent</span><div class="name">Evan Gamkrelidze</div><p>Raine &amp; Horne Mosman<br>Sales Agent · Class 1 Agent &amp; Auctioneer</p><a class="pill" href="tel:0402466066">Call 0402 466 066</a><a class="pill outline" href="/#contact">Send an enquiry</a></aside></div></div>`;document.querySelectorAll('[data-photo]').forEach(el=>el.addEventListener('click',()=>openLightbox(Number(el.dataset.photo))))}
function fail(){app.innerHTML='<div class="error"><h1>Property not found.</h1><p><a href="/">Return to the website</a></p></div>'}
document.querySelector('.close').onclick=()=>document.getElementById('lightbox').classList.remove('open');document.querySelector('.prev').onclick=()=>openLightbox((active-1+photos.length)%photos.length);document.querySelector('.next').onclick=()=>openLightbox((active+1)%photos.length);document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lightbox').classList.remove('open')});load();
</script>
</body>
</html>
